<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>حدیث</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- عنوان بالای صفحه -->
    <h1 class="title">حدیث</h1>


    <!-- متن‌های در حال بارش -->
    <div id="rain-container"></div>


    <!-- ذرات بنفش -->
    <div id="background-particles"></div>


    <!-- شخصیت اصلی -->
    <div class="character-container">

        <img
            id="hadis"
            src="hadis.png"
            alt="حدیث"
            draggable="false"
        >

    </div>


    <!-- آهنگ -->
    <audio
        id="music"
        src="music.mp3"
        preload="auto"
        loop
    ></audio>


    <script src="script.js"></script>

</body>

</html>
